function showRoom(r){currentRoom=r;const ps=roomPhotos(r),idx=rooms.indexOf(r),prev=rooms[idx-1],next=rooms[idx+1];document.title=r.name+'｜'+groupName(r.group)+'｜完成イメージ写真集';$('#current-place').textContent=groupName(r.group)+' / '+r.name;$('#view').innerHTML='<div class="progress" aria-hidden="true"><i style="width:'+((idx+1)/rooms.length*100)+'%"></i></div><header class="room-head"><div><div class="breadcrumb">'+E(groupName(r.group))+'</div><h1 tabindex="-1">'+E(r.name)+'</h1><span class="small">'+ps.length+'枚の完成イメージ</span></div><div class="room-head-actions"><span class="room-number">'+String(idx+1).padStart(2,'0')+' / '+rooms.length+'</span><a class="outline-btn" href="#index-'+r.group+'">部屋一覧へ ↗</a></div></header><div class="photo-grid">'+ps.map((p,i)=>'<figure class="photo"><button data-photo="'+i+'" aria-label="'+E(p.caption)+'を拡大"><img src="'+p.src+'" alt="'+E(groupName(r.group)+' '+r.name+' — '+p.caption)+'" width="'+p.width+'" height="'+p.height+'" '+(i?'loading="lazy"':'fetchpriority="high"')+'><span class="zoom-badge" aria-hidden="true">＋ 拡大</span></button><figcaption><span>'+E(p.caption)+'</span><span class="photo-index">'+(p.view?'<a class="view3d" href="'+view3d(p)+'">3Dで見る ↗</a>':'')+String(i+1).padStart(2,'0')+' / '+String(ps.length).padStart(2,'0')+'</span></figcaption></figure>').join('')+'</div>'+related(r)+'<nav class="room-nav" aria-label="前後の部屋">'+(prev?'<a href="#'+prev.id+'"><span aria-hidden="true">←</span><span><small>前の部屋 · '+E(groupName(prev.group))+'</small>'+E(prev.name)+'</span></a>':'<span></span>')+'<a class="all" href="#index-'+r.group+'">部屋一覧</a>'+(next?'<a href="#'+next.id+'"><span><small>次の部屋 · '+E(groupName(next.group))+'</small>'+E(next.name)+'</span><span aria-hidden="true">→</span></a>':'<span></span>')+'</nav>'+foot;$$('[data-photo]').forEach(b=>b.onclick=()=>openLight(Number(b.dataset.photo)));$('#announcement').textContent=groupName(r.group)+' '+r.name+'、'+ps.length+'枚';}
function related(r){const ids=relatedPairs.find(a=>a.includes(r.id))?.filter(id=>id!==r.id)||[];return ids.length?'<div class="related" aria-label="つながる場所">'+ids.map(id=>'<a href="#'+id+'">'+E(byId[id].name)+' →</a>').join('')+'</div>':'';}
function route(){if($('#lightbox').open)$('#lightbox').close();const h=decodeURIComponent(location.hash.slice(1));const r=byId[h];closeDrawer();$$('.room-link').forEach(a=>a.removeAttribute('aria-current'));if(r){if(!currentRoom)indexScroll=scrollY;showRoom(r);const a=$('.room-link[data-room="'+r.id+'"]');a?.setAttribute('aria-current','page');a?.closest('details').setAttribute('open','');filter=r.group;scrollTo(0,0);$('#view h1').focus({preventScroll:true});}else{if(h.startsWith('index-')&&['all',...groups.map(g=>g.id)].includes(h.slice(6)))filter=h.slice(6);const wasRoom=!!currentRoom;showIndex();scrollTo(0,wasRoom?indexScroll:0);}}
window.addEventListener('hashchange',route);route();
function openLight(i){lastFocus=document.activeElement;lightPhotos=roomPhotos(currentRoom);lightIndex=i;$('#lightbox').showModal();document.body.style.overflow='hidden';$('#light-room').textContent=currentRoom.name;$('#light-place').textContent=groupName(currentRoom.group);$('#light-thumbs').innerHTML=lightPhotos.length>1?lightPhotos.map((p,n)=>'<button data-light="'+n+'" aria-label="写真'+(n+1)+' '+E(p.caption)+'"><img src="'+p.thumb+'" alt=""></button>').join(''):'';$$('[data-light]').forEach(b=>b.onclick=()=>{lightIndex=Number(b.dataset.light);updateLight();});updateLight();}
function updateLight(){const p=lightPhotos[lightIndex];$('#light-image').src=p.src;$('#light-image').alt=p.caption;$('#light-caption').textContent=p.caption;$('#light-3d').hidden=!p.view;if(p.view)$('#light-3d').href=view3d(p);$('#light-count').textContent=String(lightIndex+1).padStart(2,'0')+' / '+String(lightPhotos.length).padStart(2,'0');$('.light-prev').disabled=lightIndex===0;$('.light-next').disabled=lightIndex===lightPhotos.length-1;$$('[data-light]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.light)===lightIndex)));}
function moveLight(step){lightIndex=Math.max(0,Math.min(lightPhotos.length-1,lightIndex+step));updateLight();}$('.light-prev').onclick=()=>moveLight(-1);$('.light-next').onclick=()=>moveLight(1);$('.light-close').onclick=()=>$('#lightbox').close();$('#lightbox').addEventListener('close',()=>{document.body.style.overflow='';$('#light-image').removeAttribute('src');lastFocus?.focus({preventScroll:true});});
document.addEventListener('keydown',e=>{if($('#lightbox').open){if(e.key==='ArrowRight'){e.preventDefault();moveLight(1);}if(e.key==='ArrowLeft'){e.preventDefault();moveLight(-1);}}else if(document.body.classList.contains('drawer-open')){if(e.key==='Escape'){closeDrawer();$('.mobile-menu').focus();}if(e.key==='Tab'){const fs=[...$('#sidebar').querySelectorAll('a,button,summary')].filter(el=>el.getClientRects().length);const first=fs[0],last=fs.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}});
let startTouch=null;$('.light-stage').addEventListener('touchstart',e=>{if(e.touches.length===1)startTouch={x:e.touches[0].clientX,y:e.touches[0].clientY};else startTouch=null;},{passive:true});$('.light-stage').addEventListener('touchend',e=>{if(!startTouch)return;const t=e.changedTouches[0],dx=t.clientX-startTouch.x,dy=t.clientY-startTouch.y;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.4)moveLight(dx<0?1:-1);startTouch=null;},{passive:true});
</script></body></html>
